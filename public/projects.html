<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){if(!document.cookie.includes("atlas_auth=ok")){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);}})();</script>
<title>atlasos.me · projects</title>
<style>
  :root{--bg:#FAF8F4;--card:#FFFDF8;--ink:#1A2540;--ink-soft:#4A5468;--ink-faint:#8590A2;--amber:#C28A3E;--amber-soft:#E5D4B1;--hair:#E8E2D4;--red:#C03A2B;--green:#6BAE73;--serif:'Cardo',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
  .topbar{height:48px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 24px;gap:14px}
  .brand{font-family:var(--serif);font-size:18px}.brand .dot{color:var(--amber)}
  .crumb{color:var(--ink-faint);font-size:12px}.crumb a{color:var(--ink-soft);text-decoration:none}
  .container{max-width:1080px;margin:0 auto;padding:36px 32px}
  h1{font-family:var(--serif);font-size:32px;font-weight:400;margin-bottom:6px}
  .subtitle{color:var(--ink-faint);font-size:13px;margin-bottom:24px;font-style:italic}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--amber);border-radius:8px;padding:18px 22px;text-decoration:none;color:var(--ink);transition:border-color 200ms,transform 200ms;display:block}
  .card:hover{border-color:var(--amber);transform:translateY(-2px)}
  .card.p0{border-left-color:var(--red)}
  .card.p1{border-left-color:var(--amber)}
  .card.p2{border-left-color:var(--ink-faint)}
  .card .name{font-family:var(--serif);font-size:18px;margin-bottom:6px}
  .card .desc{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
  .card .meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px;display:flex;gap:10px;flex-wrap:wrap}
  .pill{padding:2px 8px;border-radius:3px;background:var(--hair);color:var(--ink-faint)}
  .pill.active{background:#D8EFDB;color:var(--green)}
@keyframes ecg-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">atlasos<span class="dot">·</span>me</div>
  <div class="crumb"><a href="/us.html">Us</a> · projects (Hermes-managed)</div>
  <svg viewBox="0 0 120 24" width="120" height="24" style="margin-left:auto;opacity:0.7;"><path d="M0,12 L20,12 L25,12 L28,4 L32,20 L36,2 L40,22 L44,12 L60,12 L65,12 L68,6 L72,18 L76,12 L120,12" fill="none" stroke="#C28A3E" stroke-width="1.4" style="animation:ecg-pulse 1.6s infinite"/></svg>
</header>
<div class="container">
  <h1>Projects</h1>
  <div class="subtitle">manager-page per project · Hermes orchestrates · arms feed updates · per #27425 3-AXIS</div>
  <div style="margin-bottom:18px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);"><a href="/projects-kanban.html" style="color:var(--amber);text-decoration:none;">→ Kanban view (by status)</a></div>
  <div class="grid" id="grid">Loading…</div>
</div>
<script>
const escape = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/projects/_index.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    const grid = document.getElementById('grid');
    grid.innerHTML = (d.projects || []).map(p => `
      <a class="card ${p.priority.toLowerCase()}" href="/project.html?slug=${encodeURIComponent(p.slug)}">
        <div class="name">${escape(p.name)}</div>
        <div class="meta">
          <span class="pill ${p.status === 'active' ? 'active' : ''}">${escape(p.status)}</span>
          <span>${escape(p.priority)}</span>
          <span>owner · ${escape(p.owner_arm)}</span>
          <span>${p.canon_count} canons</span>
        </div>
        <div class="meta" style="margin-top:6px;">last · ${escape(p.last_active)}</div>
      </a>
    `).join('');
  })
  .catch(e => document.getElementById('grid').textContent = 'Load failed · ' + e.message);
</script>
</body>
</html>
