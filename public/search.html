<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){if(!document.cookie.includes("atlas_auth=ok")){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);}})();</script>
<title>atlasos.me · search</title>
<style>
  :root{--bg:#FAF8F4;--card:#FFFDF8;--ink:#1A2540;--ink-soft:#4A5468;--ink-faint:#8590A2;--amber:#C28A3E;--amber-soft:#E5D4B1;--hair:#E8E2D4;--serif:'Cardo',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
  .topbar{height:48px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 24px;gap:14px}
  .brand{font-family:var(--serif);font-size:18px}.brand .dot{color:var(--amber)}
  .crumb{color:var(--ink-faint);font-size:12px}.crumb a{color:var(--ink-soft);text-decoration:none}
  .container{max-width:720px;margin:0 auto;padding:48px 32px}
  h1{font-family:var(--serif);font-size:32px;font-weight:400;margin-bottom:6px}
  input.search{width:100%;padding:14px 18px;border:1px solid var(--hair);background:var(--card);border-radius:8px;font-family:inherit;font-size:16px;outline:none;margin-bottom:24px}
  input.search:focus{border-color:var(--amber)}
  .result{padding:14px 18px;background:var(--card);border:1px solid var(--hair);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color 120ms}
  .result:hover{border-color:var(--amber-soft)}
  .result .where{font-family:var(--mono);font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
  .result .title{font-size:14px;color:var(--ink);margin-bottom:4px}
  .result .preview{font-size:12px;color:var(--ink-soft)}
  .empty{color:var(--ink-faint);padding:40px;text-align:center;font-style:italic}
@keyframes ecg-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@media (max-width: 768px) {
  .layout, .grid, .moat-grid, .arm-grid, .tool-grid { grid-template-columns: 1fr !important; }
  .container { padding: 24px 18px !important; }
  h1 { font-size: 24px !important; }
  .topbar { padding: 0 14px !important; }
  .nav, .sidebar { display: none; }
  .crumb { font-size: 11px !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">atlasos<span class="dot">.</span>me</div>
  <div class="crumb"><a href="/us.html">Us</a> · search ⌘K</div>
  <svg viewBox="0 0 120 24" width="120" height="24" style="margin-left:auto;opacity:0.7;"><path d="M0,12 L20,12 L25,12 L28,4 L32,20 L36,2 L40,22 L44,12 L60,12 L65,12 L68,6 L72,18 L76,12 L120,12" fill="none" stroke="#C28A3E" stroke-width="1.4" style="animation:ecg-pulse 1.6s infinite"/></svg>
</header>
<div class="container">
  <h1>Search</h1>
  <input class="search" id="q" placeholder="search across all 7 cats · poems · dreams · canons · arms..." autofocus>
  <div id="results"></div>
</div>
<script>
const escape = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null;
async function load() {
  const r = await fetch('/gemma-tiered.json', {cache:'no-cache'});
  data = await r.json();
  const q = new URL(location.href).searchParams.get('q');
  if (q) { document.getElementById('q').value = q; search(q); }
}
function search(q) {
  if (!data || !q) { document.getElementById('results').innerHTML = ''; return; }
  q = q.toLowerCase();
  const matches = [];
  for (const [tier, td] of Object.entries(data.tiers || {})) {
    for (const [sub, sd] of Object.entries(td.subs || {})) {
      for (const [prio, pd] of Object.entries(sd.subsubs || {})) {
        for (const it of pd.items || []) {
          const haystack = ((it.source_filename || '') + ' ' + (it.summary || '') + ' ' + (it.id || '')).toLowerCase();
          if (haystack.includes(q)) {
            matches.push({ ...it, _tier: tier, _sub: sub, _prio: prio });
          }
        }
      }
    }
  }
  const area = document.getElementById('results');
  if (!matches.length) { area.innerHTML = '<div class="empty">no matches</div>'; return; }
  area.innerHTML = `<div style="color:var(--ink-faint);font-size:13px;margin-bottom:14px;">${matches.length} results · across ${[...new Set(matches.map(m=>m._tier))].length} categories</div>` +
    matches.slice(0,50).map(m => `<div class="result" onclick="location.href='/content.html?id=${encodeURIComponent(m.id||m.source_path||'')}&cat=${m._tier}&sub=${encodeURIComponent(m._sub)}'">
      <div class="where">${escape(m._tier)} · ${escape(m._sub.replace(/-/g,' '))} · ${m._prio}</div>
      <div class="title">${escape((m.source_filename || m.id || '').substring(0,80))}</div>
      <div class="preview">${escape((m.summary || '').substring(0,160))}</div>
    </div>`).join('');
}
document.getElementById('q').addEventListener('input', e => search(e.target.value.trim()));
load();
</script>
</body>
</html>
