<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){if(!document.cookie.includes("atlas_auth=ok")){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);}})();</script>
<title>search · ⌘K · agentic-OS</title>
<style>
  :root{--bg:#FAF8F4;--card:#FFFDF8;--ink:#1A2540;--ink-soft:#4A5468;--ink-faint:#8590A2;--amber:#C28A3E;--amber-soft:#E5D4B1;--hair:#E8E2D4;--green:#6BAE73;--serif:'Cardo',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;min-height:100vh}
  .topbar{height:52px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 24px;gap:14px;background:var(--card)}
  .brand{font-family:var(--serif);font-size:19px}.brand .dot{color:var(--amber)}
  .container{max-width:820px;margin:0 auto;padding:36px 32px 80px}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin-bottom:6px}
  .subtitle{color:var(--ink-faint);font-size:13px;margin-bottom:24px;font-style:italic}
  .search-input{width:100%;padding:14px 20px;border:2px solid var(--hair);border-radius:8px;font-size:16px;background:var(--card);color:var(--ink);margin-bottom:20px;outline:none;font-family:inherit}
  .search-input:focus{border-color:var(--amber)}
  .hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px}
  .results-section{margin-bottom:24px}
  .results-section h3{font-family:var(--mono);font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
  .result{background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--amber-soft);border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:6px;font-size:13px}
  .result a{color:var(--ink);text-decoration:none;font-weight:500}
  .result a:hover{color:var(--amber)}
  .result .meta{font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
  .result .content{color:var(--ink-soft);margin-top:3px;font-size:12.5px;line-height:1.5}
  .empty{padding:30px;color:var(--ink-faint);font-style:italic;text-align:center}
@keyframes ecg-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">atlas<span class="dot">·</span>search</div>
  <div style="color:#8590A2;font-size:12px;flex:1;"><a href="/house.html" style="color:#4A5468;text-decoration:none;">House</a> · ⌘K cross-search</div>
  <svg viewBox="0 0 120 24" width="120" height="24" style="opacity:0.7;"><path d="M0,12 L20,12 L25,12 L28,4 L32,20 L36,2 L40,22 L44,12 L60,12 L65,12 L68,6 L72,18 L76,12 L120,12" fill="none" stroke="#C28A3E" stroke-width="1.4" style="animation:ecg-pulse 1.6s infinite"/></svg>
</header>
<div class="container">
  <h1>Search · ⌘K</h1>
  <div class="subtitle">searches arms · categories · subcategories · notes · projects</div>
  <input class="search-input" id="q" placeholder="Type to search · pascal · llm-dreaming · sessions · agent-name..." autofocus>
  <div class="hint">⌘K or / focuses · Esc clears · click result to navigate</div>
  <div id="results"><div class="empty">Type 2+ characters</div></div>
</div>
<script>
const escape = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ARMS = [{key:'pascal',name:'Pascal',glyph:'🤝'},{key:'curiosity',name:'My Curiosity',glyph:'🌱'},{key:'research',name:'My Eyes',glyph:'👁'},{key:'code',name:'My Hands',glyph:'✋'},{key:'infra',name:'My Heart',glyph:'💗'},{key:'dream',name:'My Dreamer',glyph:'🌙'},{key:'hermes',name:'Hermes Orchestrator',glyph:'🧠'},{key:'charle',name:'Charle',glyph:'💼'}];
const PROJECTS = [{key:'self-help-atlas',name:'SELF-HELP-ATLAS'},{key:'upliftai-app',name:'upliftai.app'},{key:'agentic-os',name:'AGENTIC-OS atlasos.me'},{key:'brain-substrate',name:'BRAIN substrate'},{key:'arms-fleet',name:'ARMS-FLEET Hostinger'},{key:'voice-realtime',name:'VOICE real-time'},{key:'pascal-monday',name:'PASCAL Monday-call'},{key:'self-improvement',name:'SELF-IMPROVEMENT P0-P3'}];
let allArmData = {};
async function loadData() {
  await Promise.all(ARMS.map(async a => { try { const r = await fetch(`/arms-pages/${a.key}.json`, {cache:'no-cache'}); allArmData[a.key] = await r.json(); } catch(e) { allArmData[a.key] = {blocks:[]}; }}));
}
function search(q) {
  q = q.toLowerCase().trim();
  if (q.length < 2) return null;
  const armMatches = ARMS.filter(a => a.name.toLowerCase().includes(q) || a.key.includes(q));
  const projectMatches = PROJECTS.filter(p => p.name.toLowerCase().includes(q) || p.key.includes(q));
  const categories = new Set();
  const notes = [];
  for (const arm of ARMS) {
    const blocks = (allArmData[arm.key]?.blocks || []);
    for (const b of blocks) {
      const cat = b.props?.arm_category || b.props?.category || '';
      if (cat && cat.toLowerCase().includes(q)) categories.add(`${arm.key}|${cat}`);
      const content = (b.content || '').toLowerCase();
      const what = (b.props?.action || '').toLowerCase();
      const why = (b.props?.why || '').toLowerCase();
      if (content.includes(q) || what.includes(q) || why.includes(q)) {
        notes.push({arm: arm.key, armGlyph: arm.glyph, content: b.content || b.props?.action || '', cat, source: b.props?.source || '?', timestamp: b.props?.timestamp || b.updated_at || ''});
        if (notes.length >= 30) break;
      }
    }
  }
  return {armMatches, projectMatches, categories: [...categories], notes};
}
function render(q) {
  const r = search(q);
  if (!r) { document.getElementById('results').innerHTML = '<div class="empty">Type 2+ characters</div>'; return; }
  let html = '';
  if (r.armMatches.length) { html += '<div class="results-section"><h3>Arms · ' + r.armMatches.length + '</h3>'; html += r.armMatches.map(a => `<div class="result"><a href="/arm-v2.html?name=${a.key}">${a.glyph} ${escape(a.name)}</a></div>`).join(''); html += '</div>'; }
  if (r.projectMatches.length) { html += '<div class="results-section"><h3>Projects · ' + r.projectMatches.length + '</h3>'; html += r.projectMatches.map(p => `<div class="result"><a href="/manager-v2.html">📂 ${escape(p.name)}</a></div>`).join(''); html += '</div>'; }
  if (r.categories.length) { html += '<div class="results-section"><h3>Categories · ' + r.categories.length + '</h3>'; html += r.categories.map(c => { const [arm, cat] = c.split('|'); const am = ARMS.find(a => a.key === arm); return `<div class="result"><a href="/arm-v2.html?name=${arm}">${am?.glyph||'·'} ${escape(arm)} › ${escape(cat)}</a></div>`; }).join(''); html += '</div>'; }
  if (r.notes.length) { html += '<div class="results-section"><h3>Notes · ' + r.notes.length + '</h3>'; html += r.notes.map(n => `<div class="result"><a href="/arm-v2.html?name=${n.arm}">${n.armGlyph} ${escape(n.arm)} · ${escape(n.cat||'note')}</a><div class="content">${escape((n.content||'').substring(0,180))}</div><div class="meta">${escape(n.source)} · ${escape((n.timestamp||'').substring(0,16).replace('T',' '))}</div></div>`).join(''); html += '</div>'; }
  if (!html) html = '<div class="empty">No results for "' + escape(q) + '"</div>';
  document.getElementById('results').innerHTML = html;
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === 'Escape') { document.getElementById('q').value = ''; render(''); }
});
loadData();
</script>
</body>
</html>
