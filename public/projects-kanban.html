<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){if(!document.cookie.includes("atlas_auth=ok")){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);}})();</script>
<title>atlasos.me · projects kanban</title>
<style>
  :root{--bg:#FAF8F4;--card:#FFFDF8;--ink:#1A2540;--ink-soft:#4A5468;--ink-faint:#8590A2;--amber:#C28A3E;--amber-soft:#E5D4B1;--hair:#E8E2D4;--red:#C03A2B;--green:#6BAE73;--serif:'Cardo',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
  .topbar{height:48px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 24px;gap:14px}
  .brand{font-family:var(--serif);font-size:18px}.brand .dot{color:var(--amber)}
  .crumb{color:var(--ink-faint);font-size:12px}.crumb a{color:var(--ink-soft);text-decoration:none}
  .container{max-width:1200px;margin:0 auto;padding:32px 32px}
  h1{font-family:var(--serif);font-size:28px;font-weight:400;margin-bottom:6px}
  .subtitle{color:var(--ink-faint);font-size:13px;margin-bottom:24px;font-style:italic}
  .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .col{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:14px}
  .col h2{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between}
  .item{background:var(--bg);border:1px solid var(--hair);border-left:3px solid var(--amber);border-radius:5px;padding:10px 12px;margin-bottom:8px;text-decoration:none;color:var(--ink);display:block;cursor:grab}
  .item:hover{border-color:var(--amber)}
  .item.p0{border-left-color:var(--red)}
  .item.p1{border-left-color:var(--amber)}
  .item .name{font-family:var(--serif);font-size:14px;margin-bottom:4px}
  .item .meta{font-family:var(--mono);font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px}
@keyframes ecg-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@media (max-width: 768px) { .columns { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">atlasos<span class="dot">·</span>me</div>
  <div class="crumb"><a href="/us.html">Us</a> · <a href="/projects.html">projects</a> · kanban</div>
  <svg viewBox="0 0 120 24" width="120" height="24" style="margin-left:auto;opacity:0.7;"><path d="M0,12 L20,12 L25,12 L28,4 L32,20 L36,2 L40,22 L44,12 L60,12 L65,12 L68,6 L72,18 L76,12 L120,12" fill="none" stroke="#C28A3E" stroke-width="1.4" style="animation:ecg-pulse 1.6s infinite"/></svg>
</header>
<div class="container">
  <h1>Projects · kanban</h1>
  <div class="subtitle">pending · active · done · drag between (Notion-pattern) · per BIG-PUSH /goal step 9</div>
  <div class="columns" id="board">Loading…</div>
</div>
<script>
const escape = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/projects/_index.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    const STATUSES = ['pending', 'active', 'done'];
    const cols = STATUSES.map(s => ({
      status: s,
      items: (d.projects || []).filter(p => p.status === s),
    }));
    document.getElementById('board').innerHTML = cols.map(c => `
      <div class="col">
        <h2>${escape(c.status)} <span>${c.items.length}</span></h2>
        ${c.items.map(p => `
          <a class="item ${(p.priority || 'p2').toLowerCase()}" href="/project.html?slug=${encodeURIComponent(p.slug)}">
            <div class="name">${escape(p.name)}</div>
            <div class="meta">${escape(p.priority)} · ${escape(p.owner_arm)} · ${p.canon_count} canons</div>
          </a>
        `).join('')}
      </div>
    `).join('');
  })
  .catch(e => document.getElementById('board').textContent = 'Load failed · ' + e.message);
</script>
</body>
</html>
