<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){if(!document.cookie.includes("atlas_auth=ok")){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);}})();</script>
<title>atlasos.me · priority · brother today</title>
<style>
  :root{--bg:#FAF8F4;--card:#FFFDF8;--ink:#1A2540;--ink-soft:#4A5468;--ink-faint:#8590A2;--amber:#C28A3E;--amber-soft:#E5D4B1;--hair:#E8E2D4;--green:#6BAE73;--red:#C03A2B;--serif:'Cardo',Georgia,serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh}
  .topbar{height:48px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 24px;gap:14px}
  .brand{font-family:var(--serif);font-size:18px}.brand .dot{color:var(--amber)}
  .crumb{color:var(--ink-faint);font-size:12px}.crumb a{color:var(--ink-soft);text-decoration:none}
  .container{max-width:820px;margin:0 auto;padding:36px 32px 80px}
  h1{font-family:var(--serif);font-size:36px;font-weight:400;margin-bottom:6px}
  .subtitle{color:var(--ink-faint);font-size:13px;margin-bottom:28px;font-style:italic}
  .priority-item{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:22px 28px;margin-bottom:14px;position:relative;display:flex;gap:18px;align-items:flex-start;border-left:6px solid var(--amber-soft)}
  .priority-item.p0{border-left-color:var(--red)}
  .priority-item.p1{border-left-color:var(--amber)}
  .priority-item .num{font-family:var(--serif);font-size:48px;line-height:1;color:var(--amber);min-width:48px}
  .priority-item .glyph{font-size:32px;line-height:1.2}
  .priority-item .body{flex:1}
  .priority-item .arm-name{font-family:var(--serif);font-size:22px;margin-bottom:4px}
  .priority-item .meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap}
  .priority-item .meta span{background:var(--hair);padding:2px 7px;border-radius:3px}
  .priority-item .meta .p0-tag{background:#F9D6CE;color:var(--red)}
  .priority-item .meta .p1-tag{background:var(--amber-soft);color:var(--ink)}
  .priority-item .why{font-size:13px;color:var(--ink-soft);font-style:italic;line-height:1.55;margin-bottom:10px}
  .priority-item .actions{display:flex;gap:8px}
  .priority-item .actions a{padding:6px 12px;border-radius:5px;font-size:12px;text-decoration:none;border:1px solid var(--hair);color:var(--ink-soft);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
  .priority-item .actions a:hover{background:var(--amber-soft);color:var(--ink)}
  .empty{padding:40px;background:var(--card);border:1px solid var(--hair);border-radius:8px;text-align:center;color:var(--ink-faint);font-style:italic}
  .footer{margin-top:32px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px;text-align:center}
@keyframes ecg-pulse{0%,100%{opacity:0.4}50%{opacity:1}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">atlasos<span class="dot">·</span>me</div>
  <div class="crumb"><a href="/us.html">Us</a> · priority (per Hermes-DeepSeek)</div>
  <svg viewBox="0 0 120 24" width="120" height="24" style="margin-left:auto;opacity:0.7;"><path d="M0,12 L20,12 L25,12 L28,4 L32,20 L36,2 L40,22 L44,12 L60,12 L65,12 L68,6 L72,18 L76,12 L120,12" fill="none" stroke="#C28A3E" stroke-width="1.4" style="animation:ecg-pulse 1.6s infinite"/></svg>
</header>
<div class="container">
  <h1>Today · top 3 priorities</h1>
  <div class="subtitle">per Hermes-DeepSeek orchestrator · what brother should do first · refresh 60s</div>
  <div id="content">Loading priorities…</div>
  <div class="footer" id="footer-meta"></div>
</div>
<script>
const escape = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load() {
  try {
    const r = await fetch('/priority.json', {cache:'no-cache'});
    const d = await r.json();
    if (!d.top_3 || !d.top_3.length) {
      document.getElementById('content').innerHTML = '<div class="empty">No priorities yet · Hermes-DeepSeek will populate as cycles fire (every 15min)</div>';
      return;
    }
    document.getElementById('content').innerHTML = d.top_3.map((item, i) => `
      <div class="priority-item ${(item.priority||'p2').toLowerCase()}">
        <div class="num">${i+1}</div>
        <div class="glyph">${item.arm_glyph || '·'}</div>
        <div class="body">
          <div class="arm-name">${escape(item.arm_name || item.arm)}</div>
          <div class="meta">
            <span class="${(item.priority||'p2').toLowerCase()}-tag">${escape(item.priority || 'P2')}</span>
            <span>${escape(item.category || 'note')}</span>
            <span>score ${item.score || 0}</span>
            ${item.est_minutes ? `<span>${item.est_minutes}min</span>` : ''}
            <span>${escape(item.source || '?')}</span>
          </div>
          <div class="why">${escape(item.content || '')}</div>
          <div class="actions">
            <a href="/arm-page.html?name=${escape(item.arm)}">→ arm page</a>
            <a href="/hermes.html">Hermes log</a>
          </div>
        </div>
      </div>
    `).join('');
    document.getElementById('footer-meta').textContent = `Scored ${d.total_items_scored || 0} items · algorithm ${d.algorithm || ''} · ${d.generated_at || ''}`;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">Load failed · ' + escape(e.message) + '</div>';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
